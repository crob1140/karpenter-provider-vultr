# Namespaced permissions.
#
# Bootstrap tokens are Secrets in kube-system, and the cluster CA hash is read
# from the kube-root-ca.crt ConfigMap. Leader election leases live in the
# namespace the controller runs in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karpenter-provider-vultr-bootstrap
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kube-root-ca.crt"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["karpenter-leader-election"]
    verbs: ["update", "patch"]
