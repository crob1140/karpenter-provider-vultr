# Cluster-scoped permissions.
#
# This binary embeds Karpenter's own core controllers (provisioning, disruption,
# NodeClaim lifecycle, cluster state), so it needs Karpenter's full core RBAC in
# addition to the VultrNodeClass permissions. Running with only the NodeClass
# rules leaves the controller unable to watch pods, nodes or NodePools and it
# fails immediately on startup.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: karpenter-provider-vultr
rules:
  # Provider-specific NodeClass.
  - apiGroups: ["karpenter.vultr.com"]
    resources: ["vultrnodeclasses"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["karpenter.vultr.com"]
    resources: ["vultrnodeclasses/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["karpenter.vultr.com"]
    resources: ["vultrnodeclasses/finalizers"]
    verbs: ["update"]

  # Karpenter core APIs.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools", "nodeclaims", "nodeoverlays"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools/status", "nodeclaims/status", "nodeoverlays/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools/finalizers", "nodeclaims/finalizers"]
    verbs: ["update"]

  # Karpenter provisions, drains and deletes Nodes, and evicts their Pods.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces", "replicationcontrollers", "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Scheduling simulation needs the workload owners and the storage topology.
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: karpenter-provider-vultr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: karpenter-provider-vultr
subjects:
  - kind: ServiceAccount
    name: karpenter-provider-vultr
    namespace: kube-system
