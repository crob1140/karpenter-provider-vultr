apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vultrnodeclasses.karpenter.vultr.com
spec:
  group: karpenter.vultr.com
  scope: Cluster
  names:
    plural: vultrnodeclasses
    singular: vultrnodeclass
    kind: VultrNodeClass
    shortNames: [vnc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [region, kubernetesVersion, clusterEndpoint]
              properties:
                region: {type: string, minLength: 1}
                osID: {type: integer}
                snapshotID: {type: string}
                plan: {type: string}
                sshKeyIDs: {type: array, items: {type: string}}
                vpcIDs: {type: array, items: {type: string}}
                kubernetesVersion:
                  type: string
                  pattern: '^v?1\.[0-9]+(?:\.[0-9]+)?$'
                clusterEndpoint: {type: string, minLength: 1}
                caCertHash: {type: string}
                extraUserData: {type: string}
                enableIPv6: {type: boolean}
            status:
              type: object
              properties:
                resolvedPlanIDs:
                  type: array
                  items: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
