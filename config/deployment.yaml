apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-provider-vultr
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karpenter-provider-vultr
  template:
    metadata:
      labels:
        app: karpenter-provider-vultr
    spec:
      serviceAccountName: karpenter-provider-vultr
      containers:
        - name: controller
          image: ghcr.io/crob1140/karpenter-provider-vultr:dev
          env:
            - name: VULTR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vultr-api-key
                  key: api-key
            # Scopes Vultr instance ownership to this Karpenter installation.
            # Two clusters sharing one Vultr account MUST use different values,
            # or each will garbage-collect the other's nodes.
            - name: CLUSTER_NAME
              value: "REPLACE_ME"
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
