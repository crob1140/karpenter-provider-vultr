name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install envtest helper
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.22
      - name: Configure envtest
        run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path 1.35.x!)" >> "$GITHUB_ENV"
      - name: Run integration tests
        # Without this the suite skips every test and the job passes vacuously.
        env:
          VULTR_INTEGRATION_TESTS: "1"
        run: make test-integration
